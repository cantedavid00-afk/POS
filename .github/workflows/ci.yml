name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: pos_flutter_firebase

jobs:
  test:
    name: analyze, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare .env (asset requerido por la app)
        run: |
          cat > .env <<'EOF'
          FIREBASE_API_KEY=
          FIREBASE_APP_ID=
          FIREBASE_MESSAGING_SENDER_ID=
          FIREBASE_PROJECT_ID=
          FIREBASE_AUTH_DOMAIN=
          FIREBASE_STORAGE_BUCKET=
          FIREBASE_MEASUREMENT_ID=
          EOF

      - name: flutter pub get
        run: flutter pub get

      # Los avisos de estilo (info/warning) se reportan pero no bloquean; solo fallan los errores.
      - name: flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: flutter test
        run: flutter test

      # El release requiere el keystore (secreto, no versionado); se valida la
      # compilación nativa con un APK debug.
      - name: flutter build apk (debug)
        run: flutter build apk --debug
